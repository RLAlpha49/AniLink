version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      # Batch all @typescript-eslint/* packages so plugin/parser/config updates land together
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      # Batch eslint/prettier/vitest/typedoc-related tooling updates
      tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "typedoc"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
