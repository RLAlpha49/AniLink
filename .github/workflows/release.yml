name: Release

on:
    workflow_run:
        workflows:
            - CI
        types:
            - completed
        branches:
            - master
    workflow_dispatch:
        inputs:
            dry_run:
                description: Run semantic-release in dry-run mode without publishing
                required: false
                default: true
                type: boolean

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ inputs.dry_run && 'dry-run' || 'publish' }}
    cancel-in-progress: true

jobs:
    release:
        if: >-
            ${{
              (github.event_name == 'workflow_run' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'master' &&
                !contains(github.event.workflow_run.head_commit.message || '', '[skip ci]') &&
                !contains(github.event.workflow_run.head_commit.message || '', '[ci skip]') &&
                !contains(github.event.workflow_run.head_commit.message || '', 'chore(release)')) ||
              (github.event_name == 'workflow_dispatch' && inputs.dry_run)
            }}
        name: semantic-release
        runs-on: ubuntu-latest
        timeout-minutes: 25
        # Live publishes wait for approval; dry runs use an unprotected environment.
        environment: ${{ inputs.dry_run && 'release-dry-run' || 'npm' }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

            - name: Verify master has not advanced since CI
              if: ${{ github.event_name == 'workflow_run' }}
              shell: bash
              run: |
                  git fetch origin master --quiet
                  current_sha="$(git rev-parse origin/master)"
                  tested_sha="${{ github.event.workflow_run.head_sha }}"
                  if [ "$current_sha" != "$tested_sha" ]; then
                    echo "::error::master advanced after CI completed; refusing to publish stale commit $tested_sha"
                    exit 1
                  fi

            # The workflow_run conclusion is green even when an individual
            # job inside the run was skipped or soft-failed, so a future CI
            # edit that quietly drops a gate would still publish. Query the
            # triggering run's jobs and require every one to have completed
            # with success — a skipped or failed job blocks the release
            # instead of hiding behind the green workflow conclusion. Every
            # job is checked rather than an expected-name list so the gate
            # survives CI restructures and also covers jobs added later.
            - name: Verify every CI job ran and succeeded
              if: ${{ github.event_name == 'workflow_run' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  api_failures=0
                  api_stderr="$(mktemp)"
                  while :; do
                    if jobs_tsv="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                        --jq '.jobs[] | [.name, .status, (.conclusion // "none")] | @tsv' 2>"$api_stderr")"; then
                      break
                    fi
                    api_failures=$((api_failures + 1))
                    if [ "$api_failures" -ge 5 ]; then
                      echo "::error::GitHub API kept failing while listing jobs for CI run ${RUN_ID}"
                      cat "$api_stderr"
                      exit 1
                    fi
                    sleep 30
                  done
                  total_jobs="$(printf '%s\n' "$jobs_tsv" | grep -c . || true)"
                  if [ "$total_jobs" -eq 0 ]; then
                    echo "::error::CI run ${RUN_ID} reported no jobs; refusing to publish"
                    exit 1
                  fi
                  bad_jobs="$(printf '%s\n' "$jobs_tsv" | awk -F'\t' '$2 != "completed" || $3 != "success"')"
                  if [ -n "$bad_jobs" ]; then
                    echo "::error::CI run ${RUN_ID} concluded green but not every job succeeded; refusing to publish:"
                    printf '%s\n' "$bad_jobs" | awk -F'\t' '{printf "  %s (%s)\n", $1, $3}'
                    exit 1
                  fi
                  echo "All ${total_jobs} jobs in CI run ${RUN_ID} completed successfully."

            # The gate polls (like the docs deploy gate) instead of checking
            # once: a dispatch shortly after a push would otherwise fail while
            # CI is still running. The branch comes from the dispatched ref,
            # not a hardcoded master, so dispatches from other refs report
            # accurately instead of finding zero runs.
            - name: Verify CI is green for dry-run release
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  dispatched_sha="${{ github.sha }}"
                  wait_deadline=$((SECONDS + 600))
                  api_failures=0
                  zero_run_polls=0
                  api_stderr="$(mktemp)"
                  while :; do
                    if ! runs_json="$(gh run list \
                        --workflow CI \
                        --branch "${GITHUB_REF_NAME}" \
                        --commit "$dispatched_sha" \
                        --json status,conclusion 2>"$api_stderr")"; then
                      api_failures=$((api_failures + 1))
                      if [ "$api_failures" -ge 5 ]; then
                        echo "::error::GitHub API kept failing while polling CI status for commit $dispatched_sha"
                        cat "$api_stderr"
                        exit 1
                      fi
                      sleep 30
                      continue
                    fi
                    api_failures=0
                    green_runs="$(printf '%s' "$runs_json" | jq '[.[] | select(.conclusion == "success")] | length')"
                    if [ "$green_runs" -gt 0 ]; then
                      echo "CI is green for commit $dispatched_sha; proceeding with dry-run release preview."
                      exit 0
                    fi
                    total_runs="$(printf '%s' "$runs_json" | jq 'length')"
                    completed_runs="$(printf '%s' "$runs_json" | jq '[.[] | select(.status == "completed")] | length')"
                    if [ "$total_runs" -gt 0 ] && [ "$completed_runs" -eq "$total_runs" ]; then
                      echo "::error::CI runs for commit $dispatched_sha on ${GITHUB_REF_NAME} completed without success; refusing to generate a dry-run release preview from an unvalidated commit"
                      exit 1
                    fi
                    if [ "$total_runs" -eq 0 ]; then
                      zero_run_polls=$((zero_run_polls + 1))
                      if [ "$zero_run_polls" -ge 4 ]; then
                        echo "::error::No CI run exists for commit $dispatched_sha after $((zero_run_polls * 30))s (skipped, or dispatched on a ref CI does not build); refusing to generate a dry-run release preview from an unvalidated commit"
                        exit 1
                      fi
                    else
                      zero_run_polls=0
                    fi
                    if [ "$SECONDS" -ge "$wait_deadline" ]; then
                      echo "::error::Timed out waiting for CI to complete for commit $dispatched_sha on ${GITHUB_REF_NAME}; refusing to generate a dry-run release preview from an unvalidated commit"
                      exit 1
                    fi
                    echo "CI for commit $dispatched_sha is still in progress; waiting..."
                    sleep 30
                  done

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: ${{ inputs.dry_run && 'npm run release:dry' || 'npm run release' }}
