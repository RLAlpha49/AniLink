name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') && !contains(github.event.head_commit.message || '', '[ci skip]') && !contains(github.event.head_commit.message || '', 'chore(release)') }}
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Live publishes wait for approval; dry runs use an unprotected environment.
    environment: ${{ inputs.dry_run && 'release-dry-run' || 'npm' }}
    env:
      ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Run live AniList integration tests
        run: npm run test:integration

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ${{ inputs.dry_run && 'npm run release:dry' || 'npm run release' }}
