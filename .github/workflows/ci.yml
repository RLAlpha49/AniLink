name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Type-check source
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Check JSDoc comments
        run: npm run jsdoc:check

      - name: Check schema/interface sync
        run: npm run schema:sync -- --strict

      - name: Compare package contracts against AniList schema snapshot
        run: npm run anilist:api:compare -- --strict --ignore-unimplemented

      - name: Build package
        run: npm run build

  integration:
    name: Live AniList integration test
    runs-on: ubuntu-latest
    env:
      ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail if ANILIST_TOKEN is missing
        if: ${{ env.ANILIST_TOKEN == '' }}
        run: echo "::error::ANILIST_TOKEN secret is not set; live integration coverage is not running" && exit 1

      - name: Run live AniList integration test
        run: npm run test:integration
