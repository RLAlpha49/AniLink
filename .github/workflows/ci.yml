name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Type-check source
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Check JSDoc comments
        run: npm run jsdoc:check

      - name: Check generated interfaces are up to date
        run: npm run interfaces:generate -- --check

      - name: Compare package contracts against AniList schema snapshot
        run: npm run anilist:api:compare -- --strict --ignore-unimplemented

      - name: Build package
        run: npm run build

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    name: Live AniList integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Token availability is decided before anything expensive runs so fork
      # pull requests and misconfigured runs finish in seconds.
      - name: Warn when ANILIST_TOKEN is unavailable to a fork pull request
        if: ${{ env.ANILIST_TOKEN == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: echo "::warning::ANILIST_TOKEN secret is not available to fork pull requests; live integration tests are skipped"

      - name: Fail when ANILIST_TOKEN is missing outside fork pull requests
        if: ${{ env.ANILIST_TOKEN == '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: echo "::error::ANILIST_TOKEN secret is not set; live integration coverage is not running" && exit 1

      - name: Set up Node.js
        if: ${{ env.ANILIST_TOKEN != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ env.ANILIST_TOKEN != '' }}
        run: npm ci

      - name: Run live AniList integration test
        if: ${{ env.ANILIST_TOKEN != '' }}
        run: npm run test:integration
