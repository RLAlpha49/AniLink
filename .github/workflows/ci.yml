name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Type-check source
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check formatting
        run: npm run format:check

      - name: Check JSDoc comments
        run: npm run jsdoc:check

      - name: Check schema/interface sync
        run: npm run schema:sync -- --strict

      - name: Compare package contracts against AniList schema snapshot
        run: npm run anilist:api:compare -- --strict --ignore-unimplemented

      - name: Build package
        run: npm run build

  integration:
    name: Live AniList integration test
    runs-on: ubuntu-latest
    env:
      ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Warn when ANILIST_TOKEN is unavailable to a fork pull request
        if: ${{ env.ANILIST_TOKEN == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: echo "::warning::ANILIST_TOKEN secret is not available to fork pull requests; live integration tests are skipped"

      - name: Fail when ANILIST_TOKEN is missing outside fork pull requests
        if: ${{ env.ANILIST_TOKEN == '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: echo "::error::ANILIST_TOKEN secret is not set; live integration coverage is not running" && exit 1

      - name: Run live AniList integration test
        run: npm run test:integration
